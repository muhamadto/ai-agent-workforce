---
- name: Validate Codex setup state
  ansible.builtin.assert:
    that:
      - setup_state in ['present', 'absent']
    fail_msg: "setup_state must be present or absent."

- name: Resolve managed Codex agent files
  ansible.builtin.set_fact:
    codex_agent_files: >-
      {{ query('ansible.builtin.fileglob', role_path + '/files/agents/*.toml')
         | map('basename') | sort | list }}

- name: Guard Codex storage before inspecting or changing managed files
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/check_storage.py"
    stdin: >-
      {{ {'home': ansible_facts['user_dir'], 'codex_home': codex_home,
          'managed_dir': codex_managed_dir, 'agent_files': codex_agent_files} | to_json }}
    stdin_add_newline: false
  delegate_to: localhost
  register: codex_storage_check
  changed_when: false
  check_mode: false

- name: Determine Codex directory ownership
  ansible.builtin.set_fact:
    codex_directory_owned: >-
      {{ (codex_storage_check.stdout | from_json).owned }}

- name: Inspect Codex managed directory
  ansible.builtin.stat:
    path: "{{ codex_managed_dir }}"
    follow: false
  register: codex_managed_directory

- name: Render proposed Codex agent registrations privately
  ansible.builtin.set_fact:
    codex_registration_block: "{{ lookup('ansible.builtin.template', 'agents.toml.j2') }}"
  no_log: true

- name: Validate full proposed Codex configuration privately before any mutation
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/check_config.py"
    stdin: >-
      {{ {'path': codex_home + '/config.toml', 'block': codex_registration_block,
          'state': setup_state} | to_json }}
    stdin_add_newline: false
  delegate_to: localhost
  changed_when: false
  check_mode: false
  no_log: true

- name: Inspect Codex agent entry points
  ansible.builtin.stat:
    path: "{{ codex_home }}/agents/{{ item }}"
    follow: false
  loop: "{{ codex_agent_files }}"
  register: codex_agent_entries

- name: Inspect Codex shared skills entry point
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.agents/skills/ai-agent-workforce"
    follow: false
  register: codex_skills_entry

- name: Install Codex configuration
  ansible.builtin.include_tasks: create.yml
  when: setup_state == 'present'

- name: Remove Codex configuration
  ansible.builtin.include_tasks: destroy.yml
  when: setup_state == 'absent'
