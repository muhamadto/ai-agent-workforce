---
- name: Remove Claude Code settings.json
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.claude/settings.json"
    state: absent

- name: Remove Claude Code shared instruction link
  ansible.builtin.include_role:
    name: instructions
    tasks_from: remove
  vars:
    instructions_destination: "{{ ansible_facts['user_dir'] }}/.claude/CLAUDE.md"

- name: Remove Claude Code agents
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.claude/agents"
    state: absent
