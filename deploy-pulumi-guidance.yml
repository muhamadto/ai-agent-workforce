---
# Shortcut 688: deploy only reviewed guidance; preserve client configuration.
- name: Deploy owner-approved Pulumi Java guidance
  hosts: local
  gather_facts: true
  become: false
  vars:
    pulumi_guidance_files:
    - source: roles/skills/files/infrastructure-engineering/SKILL.md
      destination: '{{ ansible_facts[''user_dir''] }}/.skills/infrastructure-engineering/SKILL.md'
      previous_sha256: d53832fce96f4160c0eb1f04b5ab88c0e74b01e69496ffcbc984ed07fe30d20f
    - source: roles/skills/files/microservice-template/SKILL.md
      destination: '{{ ansible_facts[''user_dir''] }}/.skills/microservice-template/SKILL.md'
      previous_sha256: ed399757031b0a7481640800809673bcfdc23bc92efec9f2d9c67c6d4d43dbd4
    - source: roles/skills/files/modulith-template/SKILL.md
      destination: '{{ ansible_facts[''user_dir''] }}/.skills/modulith-template/SKILL.md'
      previous_sha256: 2c011165420d84f738577e1dff9070e9210ce67aeb2a04bb3ad387af3b0afba7
    - source: roles/skills/files/sandpipers-platform/SKILL.md
      destination: '{{ ansible_facts[''user_dir''] }}/.skills/sandpipers-platform/SKILL.md'
      previous_sha256: dd48a349e69bc9dd4841ff9d2bb70d479941c5e628c1925dcfe0dd66db951e95
    - source: roles/skills/files/infrastructure-engineering/SKILL.md
      destination: '{{ ansible_facts[''user_dir''] }}/.codex/skills/infrastructure-engineering/SKILL.md'
      previous_sha256: d53832fce96f4160c0eb1f04b5ab88c0e74b01e69496ffcbc984ed07fe30d20f
    - source: roles/skills/files/microservice-template/SKILL.md
      destination: '{{ ansible_facts[''user_dir''] }}/.codex/skills/microservice-template/SKILL.md'
      previous_sha256: ed399757031b0a7481640800809673bcfdc23bc92efec9f2d9c67c6d4d43dbd4
    - source: roles/skills/files/modulith-template/SKILL.md
      destination: '{{ ansible_facts[''user_dir''] }}/.codex/skills/modulith-template/SKILL.md'
      previous_sha256: 2c011165420d84f738577e1dff9070e9210ce67aeb2a04bb3ad387af3b0afba7
    - source: roles/skills/files/sandpipers-platform/SKILL.md
      destination: '{{ ansible_facts[''user_dir''] }}/.codex/skills/sandpipers-platform/SKILL.md'
      previous_sha256: dd48a349e69bc9dd4841ff9d2bb70d479941c5e628c1925dcfe0dd66db951e95
    - source: roles/claude/files/agents/infrastructure-engineer.md
      destination: '{{ ansible_facts[''user_dir''] }}/.claude/agents/infrastructure-engineer.md'
      previous_sha256: 1f9432b198d585b05235220e7d9aeca87e88e2c50edf2966b0d6277d68922f2e
    - source: roles/opencode/files/agents/infrastructure-engineer.md
      destination: '{{ ansible_facts[''user_dir''] }}/.config/opencode/agents/infrastructure-engineer.md'
      previous_sha256: af37c231b430bf0340417ffeb7d5429da6d2dbeab23093f4d69f9e36490a1646
    - source: roles/codex/files/agents/infrastructure-engineer.toml
      destination: '{{ ansible_facts[''user_dir''] }}/.codex/ai-agent-workforce/agents/infrastructure-engineer.toml'
      previous_sha256: 9e340de23082c98ceb4ceba96757bf9cb94d46806634b158e328b9a6d7cdda63
  pre_tasks:
  - name: Validate references before deploying guidance
    ansible.builtin.command:
      argv:
      - '{{ ansible_playbook_python }}'
      - '{{ playbook_dir }}/scripts/validate_skill_refs.py'
    changed_when: false
    check_mode: false
  - name: Guard managed guidance before any writes
    ansible.builtin.command:
      argv:
      - '{{ ansible_facts[''python''][''executable''] }}'
      - -c
      - |
        import hashlib, json, pathlib, stat, sys
        data = json.load(sys.stdin)
        for item in data['files']:
            destination = pathlib.Path(item['destination'])
            for parent in destination.parents:
                if not stat.S_ISDIR(parent.lstat().st_mode):
                    raise SystemExit('Guidance ancestor must be a real directory')
            info = destination.lstat()
            if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                raise SystemExit('Guidance must be a single-link regular file')
            source = pathlib.Path(data['root']) / item['source']
            desired = hashlib.sha256(source.read_bytes()).hexdigest()
            installed = hashlib.sha256(destination.read_bytes()).hexdigest()
            if installed not in (item['previous_sha256'], desired):
                raise SystemExit('Unfamiliar guidance; deployment refused')
      stdin: '{{ {''root'': playbook_dir, ''files'': pulumi_guidance_files} | to_json }}'
      stdin_add_newline: false
    changed_when: false
    check_mode: false
    no_log: true
  tasks:
  - name: Update shared instructions through guarded role
    ansible.builtin.include_role:
      name: instructions
    vars:
      instructions_destination: '{{ item }}'
    loop:
    - '{{ ansible_facts[''user_dir''] }}/.claude/CLAUDE.md'
    - '{{ ansible_facts[''user_dir''] }}/.config/opencode/AGENTS.md'
    - '{{ ansible_facts[''user_dir''] }}/.codex/AGENTS.md'
  - name: Update only reviewed infrastructure personas and skills
    ansible.builtin.copy:
      src: '{{ playbook_dir }}/{{ item.source }}'
      dest: '{{ item.destination }}'
      mode: '0600'
      backup: true
    loop: '{{ pulumi_guidance_files }}'
    loop_control:
      label: '{{ item.source }}'
