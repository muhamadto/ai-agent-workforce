"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "python3 -m venv env && env/bin/python -m pip install --disable-pip-version-check --no-input ansible ansible-lint PyYAML"
archive = "true"
run_mode = "concurrent"

[scripts.run.validate]
command = "env/bin/python scripts/validate_skill_refs.py && env/bin/ansible-playbook playbook.yml --syntax-check --limit local"
default = true
icon = "test-tube"

[scripts.run.lint]
command = "env/bin/ansible-lint --profile=basic"
icon = "code"
