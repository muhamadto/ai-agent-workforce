- name: Deploy AI Agent Workforce
  hosts: all
  gather_facts: true
  gather_subset:
    - '!all'
    - '!min'
    - 'system'
    - 'user'
    - 'python'
  become: false

  pre_tasks:
    - name: Verify safe execution and required facts
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.config', 'CACHE_PLUGIN') == 'memory'
          - lookup('ansible.builtin.config', 'HOST_KEY_CHECKING') | bool
          - ansible_facts is mapping
          - ansible_facts.env is not defined
          - ansible_env is not defined
          - ansible_facts['system'] is defined
          - ansible_facts['user_dir'] is defined
          - ansible_facts['python'] is defined
        quiet: true
        fail_msg: "Unsafe execution settings or missing required facts; use the supported launcher."
      tags:
        - always

    - name: Verify macOS platform
      ansible.builtin.fail:
        msg: "This playbook is designed for macOS only. Detected OS: {{ ansible_facts.system }}"
      when: ansible_facts.system != "Darwin"

    # Every skill named in any agent's frontmatter (both roles) must resolve to a
    # local skill directory, a github_skill_sources selection, or a known builtin.
    - name: Verify agent skill references resolve
      ansible.builtin.command: python3 {{ playbook_dir }}/scripts/validate_skill_refs.py
      delegate_to: localhost
      run_once: true  # noqa: run-once[task]
      changed_when: false
      tags:
        - always

  roles:
    - role: claude
      tags:
        - claude

    - role: opencode
      tags:
        - opencode

    - role: skills
      tags:
        - skills

    - role: codex
      tags:
        - never
        - codex

    - role: dispatcher
      tags:
        - never
        - dispatcher
