- name: Deploy AI Agent Workforce
  hosts: all
  gather_facts: true
  become: false

  pre_tasks:
    - name: Verify macOS platform
      ansible.builtin.fail:
        msg: "This playbook is designed for macOS only. Detected OS: {{ ansible_facts.system }}"
      when: ansible_facts.system != "Darwin"

    # Every skill named in any agent's frontmatter (both roles) must resolve to a
    # local skill directory, a github_skill_sources selection, or a known builtin.
    - name: Verify agent skill references resolve
      ansible.builtin.command: python3 {{ playbook_dir }}/scripts/validate_skill_refs.py
      delegate_to: localhost
      run_once: true  # noqa: run-once[task]
      changed_when: false
      tags:
        - always

  roles:
    # Default: all agents on Anthropic sonnet. Deploys to ~/.claude/agents/.
    # For per-agent model routing via opencode, use --tags opencode instead.
    - role: claude
      tags:
        - claude

    # Opt-in: per-agent opencode model routing (kimi via ollama-cloud + sonnet).
    # Runs only with --tags opencode, e.g.:
    #   ansible-playbook playbook.yml -e setup_state=present --tags opencode
    - role: opencode
      tags:
        - opencode
        - never

    - role: skills
      tags:
        - skills
